name: Baura Storefront CD

on:
  workflow_run:
    workflows:
      - Baura Storefront CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baura-official-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy React Frontend
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    environment:
      name: production
      url: https://baurabakers.com/

    steps:
      - name: Validate deployment commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Deploy verified frontend commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "bash /var/www/baura-official/deploy-frontend.sh '$DEPLOY_SHA'"

      - name: Deployment summary
        if: success()
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "### Official Frontend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: https://baurabakers.com/" >> "$GITHUB_STEP_SUMMARY"

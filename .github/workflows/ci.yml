
name: Baura Storefront CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build storefront
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: baura-storefront-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
